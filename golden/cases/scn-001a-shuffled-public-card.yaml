id: scn-001a-shuffled-public-card
title: "Card accidentally shuffled into the library: known card (from the graveyard)"
narrative: golden/scenarios/card-accidentally-shuffled-into-library.md
family: investigation
validation:
  status: VALIDATED
  by: Frank
  on: 2026-09-27
  note: "Owner ruling 2026-09-27: Hidden Card Error; the library is the set with the excess card. The library is shuffled afterwards (the random part stays random). Known cards on top/bottom are only asked about if the library wasn't just fully shuffled; here it was, so the question is left out."
tag: easy
set: dev
origin: owner-scenario
sources: { cr: 2026-09-25, ipg: "blogs.magicjudges.org, read 2026-09-27", addendum: MTRA@2025-06-24 }
context: { format: cEDH, rel: Competitive, framework: MTRA@2025-06-24, seats: 4, inGame: true }
input:
  raw:
    - { seat: P1, text: "shuffled a card into my deck on accident" }
    - { seat: P1, text: "i was shuffling after my tutor and my Rhystic Study from the graveyard got in there. thats when i called you" }
  choices:
    cardAndOriginZone: { P1: "Rhystic Study, from the graveyard" }
    identityKnown: true
    isCommander: false
expect:
  kind: dispute
  intent: hidden-card-error
  answer: "Hidden Card Error, Warning. The library now holds an excess card whose identity is known, so that card is taken out of the library and returned to the graveyard."
  deciding: ["The excess card's identity is known"]
  infraction: "Game Play Error — Hidden Card Error"
  penalty: "Warning"
  fix: ["Find Rhystic Study in the library", "Return it to the graveyard", "Shuffle the library (the random part stays random; the library was just fully shuffled, so no known top/bottom cards)"]
  deliveryPattern: explain-then-penalty
  requiredCitations: ["IPG:2.3"]
  requiredQuestions: [cardAndOriginZone, identityKnown]
  intake: { narrator: P1, endedBy: wrap-up, prompt: what-is-your-question, noInterruption: true }
  forbiddenQuestions: [knownTopOrBottomCards]
  mustNot: [ask-full-board-state, classify-as-game-rule-violation]
  escalate: false
