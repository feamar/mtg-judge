      text: "In a cEDH game, Alice's Imposter Mech entered as a copy of Bob's Esper Sentinel. It is currently an uncrewed noncreature artifact Vehicle. Bob casts his first noncreature spell this turn, triggering the copied Sentinel ability. The Mech remains uncrewed and on the battlefield as the trigger resolves. How much may Bob pay to stop Alice drawing? What changes if Alice instead activates crew 3 in response and the crew ability resolves before the Sentinel trigger? No other effects modify its power or toughness."
  cards:
    - "Imposter Mech"
    - "Esper Sentinel"
  assumptions:
    - "No unmentioned effects change the stated interaction."
    - "The stated resolutions occur only after the required priority passes."
expect:
  kind: "rules-question"
  disposition: "RESOLVED"
  answer: "Uncrewed: Bob may pay {0} to prevent the draw. Crewed before the trigger resolves: he may pay {1}. Declining to pay, even {0}, lets Alice draw."
  propositions:
    - "Imposter Mech copies Esper Sentinel's ability and copiable characteristics, with its stated exceptions: it is an artifact Vehicle, not a creature, and has crew 3."
    - "The copied ability functions while it is a noncreature."
    - "A noncreature permanent has no power or toughness, so the ability's request for its power uses 0."
    - "The ability checks that value on resolution."
    - "If crew resolves first, the Mech becomes a creature with Sentinel's copied 1/1, making X equal to 1."
    - "Crew 3 is the total power required to activate crew; it neither sets the Vehicle's power to 3 nor makes this payment {3}."
    - "A zero payment is still a choice; Bob can decline it and allow the draw."
