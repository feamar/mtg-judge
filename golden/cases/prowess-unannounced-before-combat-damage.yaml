expect:
  kind: dispute
  intent: missed-trigger
  answer: "No, not missed, provided the controller hadn't already shown they forgot. Prowess's P/T bonus is non-visible; under IPG 2.1 awareness only has to be shown the first time it visibly matters, such as combat damage. Attacking or letting a block happen doesn't show it was missed. The creature has +4/+4."
