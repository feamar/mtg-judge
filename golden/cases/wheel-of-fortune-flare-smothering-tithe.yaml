id: wheel-of-fortune-flare-smothering-tithe
title: "Wheel of Fortune / Flare of Duplication / Smothering Tithe: missed triggers"
narrative: golden/scenarios/wheel-of-fortune-flare-smothering-tithe.md
family: investigation
validation:
  status: VALIDATED
  by: Frank
  on: 2026-09-28
  note: "Owner, 2026-09-28: consider all drafted cases validated. Earlier open points are kept below as notes."
  openPoints:
    - "Which policy framework applied at the real call (MTRA, the Portuguese addendum, or plain IPG)? The remedy differs."
    - "The current IPG 2.1 text (read 2026-09-26) has no explicit 'stack became empty' clause. Its remedy puts a missed trigger 'at the appropriate place on the stack if possible or on the bottom', and triggers missed before the current phase of the previous turn are dropped. Under the MTRA, the trigger isn't added if significant decisions were made based on it being missed. Owner to state which clause made 'did the stack become empty?' decisive."
    - "Trigger count check: 2 opponents x 7 cards x 2 Wheels = 28, so the player's count may be right. It stays a claim to verify, not a fact."
