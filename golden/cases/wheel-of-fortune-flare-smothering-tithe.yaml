  raw:
    - { seat: P1, text: "I cast Wheel of Fortune, copied it with Flare of Duplication, Horn exiled what I drew, then cast some spells, and now I realise I forgot my Smothering Tithe triggers. I have 28 missed triggers, can I still put them on the stack?" }
