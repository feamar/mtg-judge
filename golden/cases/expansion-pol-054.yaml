      text: "Competitive REL Legacy. Alice chose Human for Cavern of Souls. She casts Snapcaster Mage, tapping an Island and Cavern to pay its {1}{U} cost. She does not announce which Cavern mana ability she used or say that the spell cannot be countered. Bob casts Force of Will targeting Snapcaster Mage and argues that Alice never explicitly chose Cavern's colored-mana ability. Neither player previously specified the colorless ability or a different shortcut. What is the ruling?"
  cards:
