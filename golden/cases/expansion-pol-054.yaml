expect:
  kind: "dispute"
  disposition: "RESOLVED"
  answer: "Apply the MTR 4.2 shortcut: Alice is assumed to have activated Cavern's colored-mana ability. Snapcaster Mage cannot be countered by Force of Will."
  propositions:
    - "When an object has multiple mana abilities, the tournament shortcut assumes the one most specifically applicable to the spell or ability being paid for, unless the player announces otherwise."
    - "Cavern's restricted colored-mana ability specifically applies to this Human creature spell."
    - "Its mana may pay the generic part of {1}{U}; it need not pay a colored symbol to grant the protection."
    - "Alice need not recite the ability or announce 'uncounterable'."
    - "Force of Will has a legal target but does not counter it."
    - "This is application of an established shortcut, not permission to reverse an explicitly announced colorless activation or ignore the chosen creature type."
