      text: "In a four-player cEDH game, the stack from bottom to top is: Alice's Vampiric Tutor; Bob's Mental Misstep targeting that Tutor; Carol's Impulse; Dave's Dig Through Time; and Alice's Deflecting Swat targeting Mental Misstep. All spells were legally cast. Bob paid 2 life for Misstep, and Dave used delve for Dig Through Time. There are no other spells or effects changing targets or mana costs. As Swat resolves, can Alice redirect Misstep to itself, Swat, Impulse, or Dig Through Time? What does Misstep target afterward?"
  cards:
