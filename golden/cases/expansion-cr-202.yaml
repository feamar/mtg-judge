expect:
  kind: "rules-question"
  disposition: "RESOLVED"
  answer: "Mental Misstep remains targeted at Vampiric Tutor. Deflecting Swat resolves legally, but there is no other legal target to choose for Misstep."
  propositions:
    - "Deflecting Swat can target Mental Misstep: Swat's own targeting restriction is simply a spell or ability."
    - "Changing Misstep's target must still satisfy Misstep's restriction of a spell with mana value 1."
    - "Impulse has mana value 2, Dig Through Time 8, and Swat 3, so none qualifies."
    - "Paying life for a Phyrexian symbol or using delve does not change mana value."
    - "Misstep itself has mana value 1, but a spell on the stack cannot target itself."
    - "Vampiric Tutor remains the only legal target."
    - "Swat allows Alice to leave the original target unchanged; she is not required to invent a different target."
    - "Swat then goes to the graveyard."
    - "The other spells remain on the stack; Misstep does not resolve as part of Swat's resolution."
